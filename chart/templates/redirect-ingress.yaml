{{- if .Values.redirectFrom }}
# Permanent, path- and query-preserving redirect from the old domain to {{ .Values.host }}.
# e.g. https://{{ .Values.redirectFrom }}/some-post?x=1  ->  https://{{ .Values.host }}/some-post?x=1
# 301 for GET/HEAD, 308 otherwise.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-redirect
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)$
    replacement: https://{{ .Values.host }}${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-redirect
  annotations:
    # Routed on both entry points so http:// goes straight to the target in one hop.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: wildcard-danielhnyk-cz-tls
      hosts:
        - {{ .Values.redirectFrom }}
        {{- if .Values.wwwRedirect }}
        - www.{{ .Values.redirectFrom }}
        {{- end }}
  rules:
    {{- $hosts := list .Values.redirectFrom }}
    {{- if .Values.wwwRedirect }}{{ $hosts = append $hosts (printf "www.%s" .Values.redirectFrom) }}{{ end }}
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Never reached; the middleware answers.
                name: blog
                port:
                  number: 80
    {{- end }}
{{- end }}
{{- if .Values.wwwRedirect }}
---
# www.{{ .Values.host }} -> https://{{ .Values.host }}, path + query kept (shared middleware).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-www-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: wildcard-danielalder-cz-tls # *.danielalder.cz
      hosts:
        - www.{{ .Values.host }}
  rules:
    - host: www.{{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Never reached; the middleware answers.
                name: blog
                port:
                  number: 80
{{- end }}
