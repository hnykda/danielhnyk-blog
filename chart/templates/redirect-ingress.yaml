{{- if .Values.redirectFrom }}
# Permanent (301), path-preserving redirect from the old domain to {{ .Values.host }}.
# e.g. https://{{ .Values.redirectFrom }}/some-post  ->  https://{{ .Values.host }}/some-post
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-redirect
  annotations:
    # Traefik's ingress-nginx provider doesn't expand $request_uri in
    # permanent-redirect (drops the path), but does in snippets. ssl-redirect
    # off so http:// also goes straight to the target in one hop.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      return 301 https://{{ .Values.host }}$request_uri;
spec:
  ingressClassName: public
  tls:
    - secretName: wildcard-danielhnyk-cz-tls
      hosts:
        - {{ .Values.redirectFrom }}
  rules:
    - host: {{ .Values.redirectFrom }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port:
                  number: 80
{{- end }}
